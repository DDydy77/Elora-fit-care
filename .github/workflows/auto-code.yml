name: Code IA Auto
on:
  issues:
    types: [opened, reopened]

jobs:
  correction-ia:
    if: contains(github.event.issue.title, '[IA]')
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer l'outil Gemini
        run: npm install @google/genai

      - name: Lancer la modification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node .github/scripts/gemini.js

      - name: Sauvegarder et envoyer
        run: |
          git config --global user.name "Gemini Auto-Codeur"
          git config --global user.email "ia@gemini.com"
          git add .
          git commit -m "Mise à jour par l'IA"
          git push
